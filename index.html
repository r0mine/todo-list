<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Список задач</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <h1 class="app-title">
        <span class="title-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="8" y="2" width="8" height="4" rx="1"></rect>
            <rect x="4" y="6" width="16" height="16" rx="2"></rect>
            <path d="M9 13l2 2 4-4"></path>
          </svg>
        </span>
        Мои задачи
      </h1>
      <p class="app-subtitle">Добавляйте задачи и отслеживайте прогресс</p>
    </header>

    <form class="add-form" id="addForm">
      <div class="input-group">
        <textarea
          class="add-input"
          id="addInput"
          placeholder="Что нужно сделать?"
          rows="1"
          autocomplete="off"
        ></textarea>
        <div class="error-message" id="errorMessage">Введите название задачи</div>
      </div>
      <button type="submit" class="add-button" aria-label="Добавить задачу">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>
    </form>

    <div class="task-card">
      <div class="task-scroll-area">
        <ul class="task-list" id="taskList"></ul>
        <div class="empty-state" id="emptyState">
          <div class="empty-illustration">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 11l3 3L22 4"></path>
              <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
            </svg>
          </div>
          <p class="empty-title">Пока здесь пусто</p>
          <p class="empty-text">Добавьте свою первую задачу</p>
        </div>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
